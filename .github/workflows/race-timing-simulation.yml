name: RaceTiming simulated NMEA replay
on:
  push:
    paths:
      - 'race-timing/**'
      - '.github/workflows/race-timing-simulation.yml'
  pull_request:
    paths:
      - 'race-timing/**'
      - '.github/workflows/race-timing-simulation.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s race-timing -p 'test_*.py' -v
      - name: Simulated race replay
        run: python race-timing/simulated_replay.py > race-timing-result.json
      - name: Save simulation result
        uses: actions/upload-artifact@v4
        with:
          name: race-timing-simulation
          path: race-timing-result.json
