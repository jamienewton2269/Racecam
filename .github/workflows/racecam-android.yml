name: RaceCam Android test APK
on:
  push:
    paths:
      - 'android/legacy-sage/**'
      - '.github/workflows/racecam-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build legacy SAGE test APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          test -f "$PLATFORM"
          BT="$SDK/build-tools/35.0.0"
          test -x "$BT/aapt"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          mkdir -p build/classes build/dex
          cd android/legacy-sage
          mkdir -p build/classes build/dex
          "$BT/aapt" package -f -M AndroidManifest.xml -I "$PLATFORM" -F build/unsigned.apk
          javac -source 8 -target 8 -cp "$PLATFORM" -d build/classes src/org/sailinguk/racecam/*.java
          "$BT/d8" --lib "$PLATFORM" --output build/dex $(find build/classes -name '*.class')
          cp build/dex/classes.dex ./classes.dex
          "$BT/aapt" add build/unsigned.apk classes.dex
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -noprompt -keystore build/ci-test.keystore -storepass android -keypass android -alias ci-test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=RaceCam CI TEST ONLY"
          "$BT/apksigner" sign --ks build/ci-test.keystore --ks-key-alias ci-test --ks-pass pass:android --key-pass pass:android --out build/RaceCam-CI-Test.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/RaceCam-CI-Test.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RaceCam-CI-Test-APK
          path: android/legacy-sage/build/RaceCam-CI-Test.apk
          if-no-files-found: error
          retention-days: 7
